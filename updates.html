<script type="module">
  import { initTheme, toggleTheme, startProgress, doneProgress, initScrollReveal, initSmoothScroll, initMobileNav } from './js/ui.js';
  import { initCartSidebar } from './js/cart.js';
  import { updateNavAuth } from './js/auth.js';
  import { initNavPill, markUpdatesRead } from './js/navbar.js';
  import { initPageTransition } from './js/transition.js';
  import { initWaveBackground } from './js/animations.js';
  import { db, collection, getDocs } from './js/firebase-config.js';

  window.toggleTheme = toggleTheme;
  initPageTransition();
  startProgress(); initTheme(); initScrollReveal(); initSmoothScroll(); initMobileNav(); initCartSidebar(); updateNavAuth(); initNavPill(); initWaveBackground();
  setTimeout(() => document.querySelectorAll('.fade-up').forEach(el => el.classList.add('visible')), 80);

  // Mark as read — dot hilang setelah halaman ini dibuka
  markUpdatesRead();

  // Static fallback updates — admin bisa override via Firestore 'updates' collection
  const STATIC_UPDATES = [
    {
      id: '2025-05-14',
      date: '14 Mei 2025',
      tag: 'new',
      tagLabel: 'New',
      title: 'Membership System — Starter & Elite Pass',
      desc: 'Sistem membership baru diluncurkan. Pilih antara paket Starter (gratis) atau Elite Pass (Rp 20.000) untuk akses penuh ke semua preset eksklusif, The Blueprint, Technical Edge, dan Private Asset.',
    },
    {
      id: '2025-05-13',
      date: '13 Mei 2025',
      tag: 'new',
      tagLabel: 'New',
      title: 'Edit Hub — Image Degrader & 3 Quick Tools Baru',
      desc: 'Ditambahkan Image Degrader (efek low quality), Frame to Timecode Converter, Aspect Ratio Calculator, dan Color Contrast Checker ke Edit Hub.',
    },
    {
      id: '2025-05-12',
      date: '12 Mei 2025',
      tag: 'update',
      tagLabel: 'Update',
      title: 'Payment — GoPay, DANA, SeaBank',
      desc: 'Halaman pembayaran diperbarui dengan pilihan metode: QRIS, GoPay, DANA, dan SeaBank. Tampilan lebih bersih dan informatif.',
    },
    {
      id: '2025-05-10',
      date: '10 Mei 2025',
      tag: 'fix',
      tagLabel: 'Fix',
      title: 'Dashboard Settings — Bug Toast Ganda',
      desc: 'Diperbaiki bug di halaman dashboard settings yang menampilkan dua toast sekaligus ("Settings saved" dan "Failed to save") saat menyimpan perubahan.',
    },
    {
      id: '2025-05-08',
      date: '8 Mei 2025',
      tag: 'preset',
      tagLabel: 'Preset',
      title: 'Bitrate Calculator — FPS Baru & Info Cards',
      desc: 'Ditambahkan pilihan 25fps, 50fps, dan 120fps (khusus 4K). Setiap pilihan resolusi, FPS, dan kualitas sekarang menampilkan info card dengan penjelasan kapan sebaiknya digunakan.',
    },
  ];

  async function loadUpdates() {
    const list = document.getElementById('updatesList');
    let updates = STATIC_UPDATES;

    // Try Firestore
    try {
      const snap = await getDocs(collection(db, 'updates'));
      if (!snap.empty) {
        updates = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => b.id.localeCompare(a.id));
      }
    } catch {}

    list.innerHTML = updates.map(u => `
      <div class="update-item">
        <div class="update-date">${u.date || u.id}</div>
        <div class="update-content">
          <span class="update-tag update-tag--${u.tag || 'update'}">${u.tagLabel || u.tag || 'Update'}</span>
          <div class="update-title">${u.title}</div>
          <div class="update-desc">${u.desc}</div>
        </div>
      </div>`).join('');

    doneProgress();
  }

  loadUpdates();
</script>
